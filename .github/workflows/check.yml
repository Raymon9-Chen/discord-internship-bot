name: internship-check

# Runs every 15 minutes. NOTE: GitHub's scheduled runners are best-effort and
# can be delayed under load, so treat 15 min as "about every 15 min". Also,
# cron uses UTC.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

# Allow the job to commit the updated seen.json back to the repo.
permissions:
  contents: write

# Prevent overlapping runs from racing on the seen.json commit.
concurrency:
  group: internship-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python main.py

      - name: Persist seen.json
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "chore: update seen postings [skip ci]"
            git push
          else
            echo "no change to seen.json"
          fi
